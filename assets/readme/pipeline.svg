<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"
     role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">数据流:HTML 项目 → vb_doc 场景图 → 双车道导出 → 九种格式,保存则原路写回同一份 HTML/CSS</title>
  <desc id="pipeDesc">横向四个阶段:HTML/CSS 项目、vb_doc 场景图、双车道导出、九种格式;下方虚线回路表示保存时写回同一份 canonical HTML/CSS,保证 L0 无损坏与 L1 字节幂等。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4EA1FF"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C792EA"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="330" rx="24" fill="#0B0D10"/>
  <rect x="0.75" y="0.75" width="1198.5" height="328.5" rx="23.25" fill="none" stroke="#232A33" stroke-width="1.5"/>

  <text x="56" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" letter-spacing="2.4" fill="#8B96A5">KILN 导出核心 · 双车道</text>

  <!-- 阶段 1:HTML / CSS 项目 -->
  <g id="stage-project">
    <rect x="56" y="88" width="232" height="112" rx="12" fill="#14181D" stroke="#232A33" stroke-width="1.5"/>
    <text x="76" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="26" font-weight="600" fill="#E8ECF1">HTML / CSS 项目</text>
    <text x="76" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="#8B96A5">index.html</text>
    <text x="76" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="#8B96A5">styles/ · assets/</text>
  </g>

  <line x1="292" y1="144" x2="322" y2="144" stroke="#4EA1FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段 2:vb_doc 场景图 -->
  <g id="stage-doc">
    <rect x="328" y="88" width="252" height="112" rx="12" fill="#14181D" stroke="#232A33" stroke-width="1.5"/>
    <text x="348" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="26" font-weight="600" fill="#E8ECF1">vb_doc 场景图</text>
    <text x="348" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="#8B96A5">147 条命令 · Undo/Redo</text>
    <text x="348" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="#8B96A5">data-vb-id 稳定寻址</text>
  </g>

  <line x1="584" y1="144" x2="614" y2="144" stroke="#4EA1FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段 3:双车道 -->
  <g id="stage-lanes">
    <rect x="620" y="88" width="228" height="112" rx="12" fill="#14181D" stroke="#232A33" stroke-width="1.5"/>
    <text x="640" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="26" font-weight="600" fill="#E8ECF1">双车道导出</text>
    <text x="640" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="#7FD1A6">车道 B 浏览器 CDP</text>
    <text x="640" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="#E8B84B">车道 K 自研渲染</text>
  </g>

  <line x1="852" y1="144" x2="882" y2="144" stroke="#4EA1FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 阶段 4:九种格式 -->
  <g id="stage-formats">
    <rect x="888" y="88" width="256" height="112" rx="12" fill="#14181D" stroke="#232A33" stroke-width="1.5"/>
    <text x="908" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="26" font-weight="600" fill="#E8ECF1">九种格式</text>
    <text x="908" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="#8B96A5">PNG · JPG · GIF</text>
    <text x="908" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="#8B96A5">MP4 · SVG · PDF</text>
    <text x="908" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="#8B96A5">EPS · Ai · PPTX</text>
  </g>

  <!-- 回路:保存写回同一份 HTML/CSS(自然语言在画布内居中,不与虚线相交) -->
  <g id="loop">
    <path d="M 454 200 L 454 258 L 172 258 L 172 200" fill="none"
          stroke="#C792EA" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrowBack)"/>
    <text x="316" y="290" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="20" fill="#C792EA">保存即写回同一份 HTML/CSS</text>
    <text x="316" y="316" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" fill="#8B96A5">L0 无损坏 · L1 字节幂等</text>
  </g>
</svg>
