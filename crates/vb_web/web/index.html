<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VellumBench Web 壳(K2 · 只读预览 + 轻编辑)</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 14px/1.6 system-ui, "Segoe UI", sans-serif; display: flex; height: 100vh; }
  aside { width: 320px; padding: 12px 16px; border-right: 1px solid #8884; overflow-y: auto; box-sizing: border-box; }
  main { flex: 1; display: flex; flex-direction: column; }
  #preview { flex: 1; border: 0; background:
    repeating-conic-gradient(#8881 0% 25%, transparent 0% 50%) 50% / 24px 24px; }
  h1 { font-size: 15px; margin: 4px 0 8px; }
  fieldset { border: 1px solid #8884; margin: 0 0 10px; }
  button { margin: 2px 4px 2px 0; }
  textarea { width: 100%; box-sizing: border-box; min-height: 72px; }
  #status { font-size: 12px; color: #888; white-space: pre-wrap; }
  .warn { color: #b26a00; }
  .ok { color: #1a7f37; }
  .err { color: #c62828; }
  label { display: block; margin: 6px 0 2px; }
</style>
</head>
<body>
<aside>
  <h1>VellumBench Web 壳</h1>
  <p style="font-size:12px;color:#888">只读预览 + 文字轻编辑(能力边界见 docs/k2-web-capability.md)。
  预览 = canonical HTML 本身;导出与桌面 Ctrl+S 字节同源。</p>

  <fieldset>
    <legend>1. 载入项目</legend>
    <button id="btn-example">载入内置示例(landing)</button>
    <label>或选择项目文件(index.html + styles/main.css,可多选):</label>
    <input type="file" id="file-input" multiple>
  </fieldset>

  <fieldset>
    <legend>2. 画板(切换)</legend>
    <div id="artboards">— 未载入 —</div>
  </fieldset>

  <fieldset>
    <legend>3. 文字轻编辑</legend>
    <label>文本节点:</label>
    <select id="text-select" style="width:100%"><option value="">— 未载入 —</option></select>
    <label>新内容:</label>
    <textarea id="text-editor" placeholder="选中节点后编辑"></textarea>
    <button id="btn-apply" disabled>应用(SetText)</button>
  </fieldset>

  <fieldset>
    <legend>4. 导出</legend>
    <button id="btn-export" disabled>下载 index.html + styles/main.css</button>
    <label>光栅 PNG(需字体):</label>
    <input type="file" id="font-input" accept=".ttf,.otf,.woff" multiple>
    <button id="btn-png" disabled>当前画板 → PNG</button>
  </fieldset>

  <div id="status"></div>
</aside>
<main><iframe id="preview" title="画板预览"></iframe></main>
<script type="module" src="./index.js"></script>
</body>
</html>
