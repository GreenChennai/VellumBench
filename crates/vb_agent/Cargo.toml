[package]
name = "vb_agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vellum Bench Agent 协作:CLI / patch 事务 / 文件监听(v0.6 MCP)"

[[bin]]
name = "vellum-cli"
path = "src/main.rs"

[[bin]]
name = "vellum-mcp"
path = "src/bin/vellum-mcp.rs"

[lib]
path = "src/lib.rs"

[dependencies]
vb_common = { workspace = true }
vb_html = { workspace = true }
vb_css = { workspace = true }
vb_doc = { workspace = true }
vb_layout = { workspace = true }
vb_render = { path = "../vb_render" }
vb_tools = { path = "../vb_tools" }
vb_export = { path = "../vb_export" }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
notify = "8.2.0"
