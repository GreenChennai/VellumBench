[package]
name = "vb_app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vellum Bench 桌面应用(eframe + Vello 画布)"

[[bin]]
name = "vellumbench"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
vb_common = { workspace = true }
vb_doc = { workspace = true }
vb_layout = { workspace = true }
vb_tools = { workspace = true }
vb_render = { path = "../vb_render" }
vb_export = { path = "../vb_export" }
vb_kiln = { path = "../vb_kiln" }
image = { workspace = true }
anyhow = { workspace = true }
eframe = { version = "0.35.0", features = ["wgpu"] }
rfd = "0.17.2"
env_logger.workspace = true
log.workspace = true
egui = "0.35.0"
vello = "0.10"
wgpu = "29"
vb_css.workspace = true
vb_ui = { path = "../vb_ui" }
notify = "8.2.0"
kurbo = "0.13"
# S4 外观面板:条目模型落盘为 data-vb-appearance(JSON);serde 派生 + 紧凑序列化
serde = { workspace = true }
serde_json = { workspace = true }
