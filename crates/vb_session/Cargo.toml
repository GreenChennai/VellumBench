[package]
name = "vb_session"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "VellumBench 宿主无关会话态(选中态/工具状态机/能力台账数据;零 UI 依赖)"

[dependencies]
vb_common = { workspace = true }
# 吸附引擎下沉(22 篇 §3.3:吸附单源在 vb_session):沿文档祖先链遍历
# 需要 vb_doc(§3.1 既定方向 vb_doc ← vb_session);画板本地 bbox 口径
# 复用 vb_tools::abs_bbox(复用而非抄写,防第二份几何)。两者皆无 UI 依赖。
vb_doc = { workspace = true }
vb_tools = { workspace = true }
# 会话态纯数据的(反)序列化预留:选中集/工具状态未来随 workspace 布局持久化
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
