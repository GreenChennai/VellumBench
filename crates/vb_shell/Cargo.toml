[package]
name = "vb_shell"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "VellumBench sable 宿主(R0 预览壳:GPUI 开窗 + dock 工作台)"

[[bin]]
name = "vellum-sable"
path = "src/main.rs"

[dependencies]
# 宿主、会话投影与轻量导出;不直接依赖 vb_doc。
# SVG/PNG 从 ProjectSession 的 DrawList 快照渲染,原子落盘由 vb_common 提供。
# canvas_spike 仍是独立基准入口,GPUI/Vello 设备依赖不进入项目画布路径。
sable = { workspace = true, features = ["backend-auto"] }
vb_kit = { workspace = true }
vb_session = { workspace = true }
vb_render = { workspace = true }
vb_export = { path = "../vb_export" }
vb_common = { workspace = true }
# 硬骨头 #13(22 篇 §3.7):gpui 宿主的平台服务 seam(深色探测/剪贴板/
# 光标/窗口/DPI/对话框),OS 触点归口一处;实现经 sable::gpui 同锁版本
vb_platform = { path = "../vb_platform", features = ["gpui"] }
# canvas_spike(22 篇 §4 R0 交付 3):vello Scene/Renderer 与 wgpu 一律经
# vello::wgpu re-export 使用(与 vb_render/sable-paint 同一 vello 0.10 实例,
# 单一真相);pollster 阻塞式设备初始化(Cargo.lock 已有 0.4,零新增编译);
# image 供 RenderImage 裸帧构造(与 gpui 0.2.2 同一 0.25 实例)。
vello = "0.10"
pollster = "0.4"
image = { workspace = true }
