<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>c3 多行段落</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{background:#fff}.ab{position:relative;width:1280px;height:800px;overflow:hidden}.card{position:absolute;left:100px;top:100px;width:900px;height:400px;background:#f8fafc;border:1px solid #e2e8f0}
.p{position:absolute;left:140px;top:150px;width:820px;font:400 26px/1.7 'Microsoft YaHei';color:#1e293b}
.p2{position:absolute;left:140px;top:420px;width:700px;font:400 24px/1.6 'Microsoft YaHei';color:#64748b}</style></head><body><div class="ab"><div class="card"></div><div class="p">过去八年,咖啡从提神工具变成了城市生活的基础设施。本报告用三个视角拆解这件事:喝多少、在哪儿喝、为谁买单。人均杯数持续走高,增速开始分化,一线人均十九杯每年,是二零一九年的两倍多,二三年后增速放缓,存量市场转向品质竞争,新一线成为增量引擎。</div><div class="p2">连锁门店数三年翻番,渗透到县域市场,独立咖啡馆数量持平,但客单价高出百分之二十八,两者客群重叠度仅三成,不是替代,是分工。</div></div></body></html>
