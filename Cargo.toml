[workspace]
resolver = "2"
members = [
    "crates/vb_common",
    "crates/vb_css",
    # COUP-01(ADR-0053):文本量测/整形底层,vb_layout 与 vb_render 共同下依赖
    "crates/vb_textmeasure",
    "crates/vb_html",
    "crates/vb_doc",
    "crates/vb_layout",
    "crates/vb_render",
    "crates/vb_tools",
    "crates/vb_export",
    "crates/vb_kiln",
    "crates/vb_browser",
    "crates/vb_agent",
    "crates/vb_plugin",
    "crates/vb_platform",
    "crates/vb_ui",
    "crates/vb_app",
    # R0 双宿主脚手架(22 篇 §4 R0):会话态提取 / sable 面板与控件 / sable 宿主
    "crates/vb_session",
    "crates/vb_kit",
    "crates/vb_shell",
    # K2 Web 壳(05-11-2,台账 09-K):仅 wasm32 使用;加入 workspace 是为了
    # 统一版本/过门禁(宿主编译无行为,详见该 crate 文档头)
    "crates/vb_web",
]

[workspace.package]
version = "0.14.1"
edition = "2021"
# ACL-1.0 是自定义协议(非 SPDX 标准标识符),故用 license-file 指向根 LICENSE
license-file = "LICENSE"
repository = "https://github.com/GreenChennai/VellumBench"
rust-version = "1.85"

[profile.dev]
# 磁盘减脂(2026-09-26):dev/test 的全量调试信息是 target/debug 膨胀主力
# (单轮迭代可涨 50–100GB)。改行级调试表后回溯仍有 file:line,
# target 增速约降三分之二;需要完整变量级调试时临时用
# `cargo build --profile dev2` 之类再加full配置。
debug = 1

[workspace.dependencies]
vb_common = { path = "crates/vb_common" }
vb_css = { path = "crates/vb_css" }
vb_html = { path = "crates/vb_html" }
vb_doc = { path = "crates/vb_doc" }
vb_tools = { path = "crates/vb_tools" }
vb_layout = { path = "crates/vb_layout" }
vb_plugin = { path = "crates/vb_plugin" }
vb_platform = { path = "crates/vb_platform" }
vb_session = { path = "crates/vb_session" }
vb_kit = { path = "crates/vb_kit" }
vb_shell = { path = "crates/vb_shell" }
vb_render = { path = "crates/vb_render" }
vb_textmeasure = { path = "crates/vb_textmeasure" }

# R0 换宿主(22 篇 §3.6 版本锁定):sable 门面,rev 与 cutforge 同锁;
# 升级 = 显式提交带 diff 审查,勿随手改。
sable = { git = "https://github.com/GreenChennai/sable-ui.git", rev = "72d83c65ae149334c362d5e4bf9f0c84057781c2" }

kurbo = "0.13"
slotmap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2" }
image = "0.25"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
# RB-11 可观测性:vb_agent/vb_plugin 关键路径结构化日志(VB_LOG 控级别)
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
# R0 i18n 地基(硬骨头 #2 前半):Fluent 运行时 + 语言 id;版本锁 0.17/0.9
# (MSRV 1.67,低于工具链 1.98;升级走"升级窗口"纪律,不追新)
fluent = "0.17.0"
unic-langid = "0.9.6"
# fluent-bundle 同源依赖(降级判定数消息条数用;树内已有,零新增编译)
fluent-syntax = "0.12.0"

[profile.release]
lto = "thin"
strip = "symbols"
