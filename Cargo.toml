[workspace]
resolver = "2"
members = [
    "crates/vb_common",
    "crates/vb_css",
    "crates/vb_html",
    "crates/vb_doc",
    "crates/vb_layout",
    "crates/vb_render",
    "crates/vb_tools",
    "crates/vb_export",
    "crates/vb_kiln",
    "crates/vb_browser",
    "crates/vb_agent",
    "crates/vb_plugin",
    "crates/vb_platform",
    "crates/vb_ui",
    "crates/vb_app",
    # K2 Web 壳(05-11-2,台账 09-K):仅 wasm32 使用;加入 workspace 是为了
    # 统一版本/过门禁(宿主编译无行为,详见该 crate 文档头)
    "crates/vb_web",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
# ACL-1.0 是自定义协议(非 SPDX 标准标识符),故用 license-file 指向根 LICENSE
license-file = "LICENSE"
repository = "https://github.com/GreenChennai/VellumBench"
rust-version = "1.85"

[profile.dev]
# 磁盘减脂(2026-09-26):dev/test 的全量调试信息是 target/debug 膨胀主力
# (单轮迭代可涨 50–100GB)。改行级调试表后回溯仍有 file:line,
# target 增速约降三分之二;需要完整变量级调试时临时用
# `cargo build --profile dev2` 之类再加full配置。
debug = 1

[workspace.dependencies]
vb_common = { path = "crates/vb_common" }
vb_css = { path = "crates/vb_css" }
vb_html = { path = "crates/vb_html" }
vb_doc = { path = "crates/vb_doc" }
vb_tools = { path = "crates/vb_tools" }
vb_layout = { path = "crates/vb_layout" }

kurbo = "0.13"
slotmap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2" }
image = "0.25"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
strip = "symbols"
