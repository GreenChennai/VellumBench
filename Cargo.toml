[workspace]
resolver = "2"
members = [
    "crates/vb_common",
    "crates/vb_css",
    "crates/vb_html",
    "crates/vb_doc",
    "crates/vb_layout",
    "crates/vb_render",
    "crates/vb_tools",
    "crates/vb_export",
    "crates/vb_agent",
    "crates/vb_platform",
    "crates/vb_ui",
    "crates/vb_app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/GreenChennai/VellumBench"
rust-version = "1.85"

[workspace.dependencies]
vb_common = { path = "crates/vb_common" }
vb_css = { path = "crates/vb_css" }
vb_html = { path = "crates/vb_html" }
vb_doc = { path = "crates/vb_doc" }
vb_layout = { path = "crates/vb_layout" }
vb_render = { path = "crates/vb_render" }
vb_tools = { path = "crates/vb_tools" }
vb_export = { path = "crates/vb_export" }
vb_platform = { path = "crates/vb_platform" }
vb_ui = { path = "crates/vb_ui" }
vb_agent = { path = "crates/vb_agent" }

kurbo = "0.13"
slotmap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
html5ever = "0.29"
markup5ever_rcdom = "0.35"
image = "0.25"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
iconflow = { version = "1.0", default-features = false, features = ["pack-lucide"] }

[profile.release]
lto = "thin"
strip = "symbols"
