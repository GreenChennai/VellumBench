# Vellum Bench 命令表(v0.1 子集)
# 单一真相:菜单 / 快捷键 / 面板 / Agent CLI 共用。
# expose_to_agent: 可通过 `vellum-cli patch {"op":"run","command":...}` 执行
- id: file.new
  label: 新建
  keys: { win: "Ctrl+N" }
  undoable: false
  expose_to_agent: true
- id: file.open
  label: 打开
  keys: { win: "Ctrl+O" }
  undoable: false
  expose_to_agent: false
- id: file.save
  label: 存储
  keys: { win: "Ctrl+S" }
  undoable: false
  expose_to_agent: true
- id: file.export_png
  label: 导出 PNG
  keys: { win: "Ctrl+E" }
  undoable: false
  expose_to_agent: true
- id: edit.undo
  label: 撤销
  keys: { win: "Ctrl+Z" }
  undoable: false
  expose_to_agent: true
- id: edit.redo
  label: 重做
  keys: { win: "Ctrl+Shift+Z" }
  undoable: false
  expose_to_agent: true
- id: object.group
  label: 编组
  keys: { win: "Ctrl+G" }
  undoable: true
  expose_to_agent: true
- id: object.ungroup
  label: 取消编组
  keys: { win: "Ctrl+Shift+G" }
  undoable: true
  expose_to_agent: true
- id: object.delete
  label: 删除
  keys: { win: "Delete" }
  undoable: true
  expose_to_agent: true
- id: object.transform_again
  label: 再次变换
  keys: { win: "Ctrl+D" }
  undoable: true
  expose_to_agent: true
- id: view.zoom_in
  label: 放大
  keys: { win: "Ctrl++" }
  undoable: false
  expose_to_agent: false
- id: view.zoom_out
  label: 缩小
  keys: { win: "Ctrl+-" }
  undoable: false
  expose_to_agent: false
- id: view.fit
  label: 适合窗口
  keys: { win: "Ctrl+0" }
  undoable: false
  expose_to_agent: false
- id: view.actual_size
  label: 实际大小
  keys: { win: "Ctrl+1" }
  undoable: false
  expose_to_agent: false
- id: tool.select
  label: 选择工具
  keys: { win: "V" }
  undoable: false
  expose_to_agent: false
- id: tool.direct_select
  label: 直接选择工具
  keys: { win: "A" }
  undoable: false
  expose_to_agent: false
- id: tool.rect
  label: 矩形工具
  keys: { win: "M" }
  undoable: false
  expose_to_agent: false
- id: tool.ellipse
  label: 椭圆工具
  keys: { win: "L" }
  undoable: false
  expose_to_agent: false
- id: tool.hand
  label: 抓手工具
  keys: { win: "H" }
  undoable: false
  expose_to_agent: false
# ── P3 批次(剪贴板 / 对齐 / 锁定隐藏 / 命令面板) ──
- id: edit.copy
  label: 复制
  keys: { win: "Ctrl+C" }
  undoable: false
  expose_to_agent: true
- id: edit.cut
  label: 剪切
  keys: { win: "Ctrl+X" }
  undoable: true
  expose_to_agent: true
- id: edit.paste
  label: 粘贴
  keys: { win: "Ctrl+V" }
  undoable: true
  expose_to_agent: true
- id: edit.paste_in_place
  label: 贴在前面(就地)
  keys: { win: "Ctrl+F" }
  undoable: true
  expose_to_agent: true
- id: align.left
  label: 水平左对齐
  keys: { win: "Ctrl+Shift+L" }
  undoable: true
  expose_to_agent: true
- id: align.hcenter
  label: 水平居中对齐
  keys: { win: "Ctrl+Shift+C" }
  undoable: true
  expose_to_agent: true
- id: align.right
  label: 水平右对齐
  keys: { win: "Ctrl+Shift+R" }
  undoable: true
  expose_to_agent: true
- id: align.top
  label: 垂直顶对齐
  keys: { win: "Ctrl+Shift+T" }
  undoable: true
  expose_to_agent: true
- id: align.vcenter
  label: 垂直居中对齐
  keys: { win: "Ctrl+Shift+V" }
  undoable: true
  expose_to_agent: true
- id: align.bottom
  label: 垂直底对齐
  keys: { win: "Ctrl+Shift+B" }
  undoable: true
  expose_to_agent: true
- id: object.lock
  label: 锁定所选
  keys: { win: "Ctrl+2" }
  undoable: true
  expose_to_agent: true
- id: object.hide
  label: 隐藏所选
  keys: { win: "Ctrl+3" }
  undoable: true
  expose_to_agent: true
- id: object.unlock_all
  label: 解锁全部
  keys: { win: "Ctrl+Alt+2" }
  undoable: false
  expose_to_agent: true
- id: object.show_all
  label: 显示全部
  keys: { win: "Ctrl+Alt+3" }
  undoable: false
  expose_to_agent: true
- id: app.command_palette
  label: 命令面板
  keys: { win: "Ctrl+K" }
  undoable: false
  expose_to_agent: false
