# Vellum Bench 命令表
# 单一真相:菜单 / 快捷键 / 面板 / Agent CLI 共用。
# 本文件由注册表(cmds.yaml 门禁测试)校验同步;ID/label/键位以
# vb_app::shortcuts 为准,undoable / expose_to_agent 为人工策展列。
# expose_to_agent: 可通过 `vellum-cli patch {"op":"run","command":...}` 执行
- id: file.new
  label: 新建文档
  keys: { win: "Ctrl+N" }
  undoable: false
  expose_to_agent: true
- id: file.open
  label: 打开项目…
  keys: { win: "Ctrl+O" }
  undoable: false
  expose_to_agent: true
- id: file.save
  label: 保存
  keys: { win: "Ctrl+S" }
