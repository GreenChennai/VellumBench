  expose_to_agent: true
- id: file.export_dialog
  label: 导出…
  keys: { win: "Ctrl+E" }
  undoable: false
  expose_to_agent: true
- id: file.export_repeat
  label: 上次导出(当前画板 PNG @2x)
  keys: { win: "Ctrl+Shift+E" }
  undoable: false
  expose_to_agent: true
